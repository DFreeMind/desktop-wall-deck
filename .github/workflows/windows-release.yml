name: Windows 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: 配置 Rust
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - name: 安装前端依赖
        run: npm ci
      - name: 校验版本
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $version = $package.version
          if ($lock.version -ne $version -or $lock.packages[''].version -ne $version -or $tauri.version -ne $version -or $cargoVersion -ne $version) {
            throw '前端、锁文件、Tauri 与 Rust 版本不一致'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw '发布 tag 必须与应用版本一致'
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: 检查前端并构建
        run: npm run build
      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: 打包 Windows 应用
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run tauri build -- --ci -- --locked
      - name: 整理发布文件与校验和
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw '必须生成一个 NSIS 安装程序' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination "release/desktop-wall-deck_$($env:APP_VERSION)_x64-setup.exe"
          Copy-Item -LiteralPath src-tauri/target/release/desktop-wall-deck.exe -Destination "release/desktop-wall-deck_$($env:APP_VERSION)_x64.exe"
          Get-ChildItem release/*.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: 保存构建产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-${{ env.APP_VERSION }}
          path: release/*
          if-no-files-found: error
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = "docs/releases/$($env:APP_VERSION).md"
          $assets = @(Get-ChildItem release/* | ForEach-Object { $_.FullName })
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME, '--verify-tag', '--title', "桌面壁纸 $($env:APP_VERSION)")
          if (Test-Path -LiteralPath $notes) { $releaseArgs += @('--notes-file', $notes) }
          else { $releaseArgs += '--generate-notes' }
          & gh @releaseArgs @assets
